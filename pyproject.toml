[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "csi-active-calibration-rl"
version = "0.1.0"
description = "A small Gymnasium environment for learning which Wi-Fi activity examples to label"
requires-python = ">=3.11"
dependencies = ["numpy==2.4.3", "gymnasium==1.4.0"]

[project.optional-dependencies]
train = ["torch==2.10.0"]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["active_calibration*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
