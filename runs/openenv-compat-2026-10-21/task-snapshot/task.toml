schema_version = "1.4"
artifacts = [{ source = "/state/query_history.json", service = "calibration" }]

[task]
name = "csi-calibration/label-selection"
version = "0.1.0"
description = "Choose 16 activity labels to improve a fixed CSI classifier."

[metadata]
category = "ML"
tags = ["wifi", "csi", "active-learning", "rl"]

[verifier]
timeout_sec = 120.0
environment_mode = "separate"

[verifier.environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048

[agent]
timeout_sec = 900.0

[environment]
build_timeout_sec = 600.0
network_mode = "public"
cpus = 1
memory_mb = 2048
storage_mb = 4096
